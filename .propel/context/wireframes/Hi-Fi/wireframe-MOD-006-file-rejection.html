<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>MOD-006 · File Rejection Alert</title>
<link rel="stylesheet" href="shared-tokens.css">
</head>
<body>
<!-- Navigation Map
| Element | Action | Target Screen |
|---------|--------|---------------|
| #btn-ok | click | Closes dialog, returns to SCR-011 |
| UC: UC-011 |
-->
<a href="#main" class="skip-link">Skip to main content</a>
<div class="modal-backdrop">
  <div class="modal" role="alertdialog" aria-labelledby="mod006-title" aria-describedby="mod006-desc" id="main" style="max-width:420px;">
    <div class="modal-header">
      <h2 class="modal-title" id="mod006-title" style="color:var(--destructive);">File rejected</h2>
    </div>
    <div class="modal-body">
      <p id="mod006-desc" class="text-sm mb-4">The file <strong>report.exe</strong> could not be uploaded.</p>
      <div class="alert alert-destructive mb-4" role="alert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="alert-icon" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        <div class="alert-content">
          <div class="alert-title">Reason: Unsupported file format</div>
          <div class="text-sm">.exe files are not allowed.</div>
        </div>
      </div>
      <div>
        <div class="text-sm font-medium mb-2">Accepted formats:</div>
        <div class="flex gap-2" style="flex-wrap:wrap;">
          <span class="badge badge-secondary">PDF</span>
          <span class="badge badge-secondary">DOCX</span>
          <span class="badge badge-secondary">JPG</span>
          <span class="badge badge-secondary">PNG</span>
          <span class="badge badge-secondary">DICOM</span>
          <span class="badge badge-secondary">FHIR</span>
        </div>
        <div class="text-xs text-muted mt-2">Maximum file size: 50 MB</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" id="btn-ok">OK</button>
    </div>
  </div>
</div>
</body>
</html>
