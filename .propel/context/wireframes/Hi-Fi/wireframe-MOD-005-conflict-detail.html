<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>MOD-005 · Conflict Detail Dialog</title>
<link rel="stylesheet" href="shared-tokens.css">
</head>
<body>
<!-- Navigation Map
| Element | Action | Target Screen |
|---------|--------|---------------|
| #btn-accept-1 / #btn-accept-2 | click | Resolves conflict, closes dialog, returns to SCR-020 |
| #btn-close | click | Closes dialog |
| UC: UC-014 |
-->
<a href="#main" class="skip-link">Skip to main content</a>
<div class="modal-backdrop">
  <div class="modal" role="dialog" aria-labelledby="mod005-title" id="main" style="max-width:560px;">
    <div class="modal-header">
      <h2 class="modal-title" id="mod005-title">Conflict detail — Blood pressure</h2>
      <button class="btn btn-ghost btn-sm" aria-label="Close" id="btn-close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="flex flex-col gap-4">
        <div class="conflict-highlight" style="padding:var(--space-4);border-radius:var(--radius-md);border:1px solid var(--border);">
          <div class="text-xs text-muted mb-1">Source: EHR</div>
          <div class="font-medium text-lg">142/88 mmHg</div>
          <div class="text-xs text-muted mt-1">Recorded: Jan 20, 2025 by Dr. Sarah Chen</div>
          <button class="btn btn-outline btn-sm mt-3" id="btn-accept-1" style="width:100%;">Accept this value</button>
        </div>
        <div class="text-center text-sm text-muted">— vs —</div>
        <div class="conflict-highlight" style="padding:var(--space-4);border-radius:var(--radius-md);border:1px solid var(--border);">
          <div class="text-xs text-muted mb-1">Source: Patient intake (AI-extracted)</div>
          <div class="font-medium text-lg">138/85 mmHg</div>
          <div class="text-xs text-muted mt-1">Submitted: Jan 26, 2025 by Maria Santos</div>
          <div class="text-xs mt-1"><span class="badge badge-success" style="font-size:10px;">AI confidence: 91%</span></div>
          <button class="btn btn-outline btn-sm mt-3" id="btn-accept-2" style="width:100%;">Accept this value</button>
        </div>
      </div>
      <div class="form-group mt-4">
        <label class="form-label" for="custom-val">Or enter a custom value</label>
        <div class="flex gap-2">
          <input type="text" id="custom-val" class="form-input" placeholder="e.g., 140/86">
          <button class="btn btn-secondary">Apply</button>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
