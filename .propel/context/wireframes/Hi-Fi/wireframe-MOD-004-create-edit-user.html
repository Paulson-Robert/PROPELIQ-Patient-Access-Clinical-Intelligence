<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>MOD-004 · Create / Edit User Dialog</title>
<link rel="stylesheet" href="shared-tokens.css">
</head>
<body>
<!-- Navigation Map
| Element | Action | Target Screen |
|---------|--------|---------------|
| #btn-save | click | Closes dialog, returns to SCR-023 with toast |
| #btn-close | click | Closes dialog, returns to SCR-023 |
| UC: UC-018 |
-->
<a href="#main" class="skip-link">Skip to main content</a>
<div class="modal-backdrop">
  <div class="modal" role="dialog" aria-labelledby="mod004-title" id="main" style="max-width:480px;">
    <div class="modal-header">
      <h2 class="modal-title" id="mod004-title">Create user</h2>
      <button class="btn btn-ghost btn-sm" aria-label="Close" id="btn-close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="flex flex-col gap-4">
        <div class="form-group">
          <label class="form-label" for="user-name">Full name <span style="color:var(--destructive);">*</span></label>
          <input type="text" id="user-name" class="form-input" placeholder="e.g., Jane Doe" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="user-email">Email address <span style="color:var(--destructive);">*</span></label>
          <input type="email" id="user-email" class="form-input" placeholder="jane.doe@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="user-role">Role <span style="color:var(--destructive);">*</span></label>
          <select id="user-role" class="form-select" required>
            <option value="">Select role</option>
            <option>Patient</option>
            <option>Staff</option>
            <option>Admin</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="user-status">Status</label>
          <select id="user-status" class="form-select">
            <option selected>Active</option>
            <option>Inactive</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" id="btn-save">Create user</button>
      <button class="btn btn-ghost">Cancel</button>
    </div>
  </div>
</div>
</body>
</html>
