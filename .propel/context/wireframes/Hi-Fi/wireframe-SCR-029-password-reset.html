<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>SCR-029 · Password Reset</title>
<link rel="stylesheet" href="shared-tokens.css">
</head>
<body>
<!-- Navigation Map
| Element | Action | Target Screen |
|---------|--------|---------------|
| #btn-send-link | click | Shows "Check your email" confirmation inline |
| #btn-reset | click | wireframe-SCR-001-login-registration.html |
| #link-back | click | wireframe-SCR-001-login-registration.html |
| UC: UC-001 |
-->
<a href="#main" class="skip-link">Skip to main content</a>
<div class="auth-layout">
  <div class="auth-brand">
    <div class="auth-brand-inner">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M11 2a2 2 0 0 0-2 2v5H4a2 2 0 0 0-2 2v2c0 1.1.9 2 2 2h5v5c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2v-5h5a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2h-5V4a2 2 0 0 0-2-2h-2z"/></svg>
      <h1 style="font-size:var(--text-2xl);font-weight:700;margin-top:var(--space-4);">HealthAccess</h1>
    </div>
  </div>
  <div class="auth-form">
    <main class="auth-form-inner" id="main">
      <!-- Step 1: Request Reset -->
      <h2 style="font-size:var(--text-xl);font-weight:600;margin-bottom:var(--space-2);">Reset your password</h2>
      <p class="text-sm text-muted mb-6">Enter your email address and we'll send you a reset link.</p>
      <div class="form-group mb-4">
        <label class="form-label" for="reset-email">Email address</label>
        <input type="email" id="reset-email" class="form-input" placeholder="you@example.com">
      </div>
      <button class="btn btn-primary" id="btn-send-link" style="width:100%;">Send reset link</button>
      <div class="text-center mt-4"><a href="wireframe-SCR-001-login-registration.html" class="form-link" id="link-back">← Back to sign in</a></div>

      <hr style="margin:var(--space-6) 0;border:none;border-top:1px solid var(--border);">

      <!-- Step 2: New Password (shown after clicking email link) -->
      <div style="opacity:0.5;">
        <h3 class="font-medium mb-4">Create new password</h3>
        <div class="flex flex-col gap-4">
          <div class="form-group">
            <label class="form-label" for="new-pw">New password</label>
            <input type="password" id="new-pw" class="form-input" placeholder="Enter new password">
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm-pw">Confirm new password</label>
            <input type="password" id="confirm-pw" class="form-input" placeholder="Re-enter password">
          </div>
          <a href="wireframe-SCR-001-login-registration.html" class="btn btn-primary" id="btn-reset" style="width:100%;text-align:center;">Reset password</a>
        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
